<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <linearGradient id="mhGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9933" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#8B6508" />
    </linearGradient>
    <linearGradient id="mhBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#800000" />
      <stop offset="100%" stop-color="#4A0000" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Outer Seal Circle with Marathi Traditional Maroon Border -->
  <circle cx="120" cy="120" r="114" fill="url(#mhBg)" stroke="url(#mhGold)" stroke-width="6"/>
  <circle cx="120" cy="120" r="102" fill="none" stroke="#FFF" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Official Royal Seal Emblem Rim Inscription -->
  <!-- Top Text: MAHARASHTRA SHASAN -->
  <path id="textArcTop" d="M 32 120 A 88 88 0 0 1 208 120" fill="none" />
  <text font-family="'Noto Sans Devanagari', 'Yatra One', 'Arial', sans-serif" font-weight="bold" font-size="14" fill="#FFE599" filter="url(#shadow)">
    <textPath href="#textArcTop" startOffset="50%" text-anchor="middle">
      ★ महाराष्ट्र शासन ★
    </textPath>
  </text>

  <!-- Bottom Text: KRISHI VIBHAG - SIH26131 -->
  <path id="textArcBottom" d="M 208 120 A 88 88 0 0 1 32 120" fill="none" />
  <text font-family="'Noto Sans Devanagari', 'Arial', sans-serif" font-weight="bold" font-size="11" fill="#FFE599" filter="url(#shadow)">
    <textPath href="#textArcBottom" startOffset="50%" text-anchor="middle">
      कृषी विभाग · GOVT OF MAHARASHTRA
    </textPath>
  </text>

  <!-- Inner Octagonal Fort Seal (Shivaji Maharaj Rajmudra Shield) -->
  <polygon points="120,44 164,62 182,106 164,150 120,168 76,150 58,106 76,62" 
           fill="#500707" stroke="url(#mhGold)" stroke-width="3.5" />

  <!-- Chhatrapati Shivaji Maharaj Rajmudra Sacred Inscription Motif -->
  <!-- "प्रतिपच्चंद्रलेखेव वर्धिष्णुर्विश्ववंदिता शाहसूनोः शिवस्यैषा मुद्रा भद्राय राजते" -->
  <g fill="url(#mhGold)" filter="url(#shadow)">
    <!-- Crescent Moon (Pratipada Chandra) at Top of Shield -->
    <path d="M102,68 Q120,54 138,68 Q120,60 102,68 Z" fill="#FFE599" />
    
    <!-- Stylized Sanskrit Devnagari Script Lines representing the Royal Seal -->
    <rect x="88" y="76" width="64" height="3" rx="1.5" />
    <rect x="94" y="82" width="52" height="2.5" rx="1" />
    
    <text x="120" y="96" font-family="'Noto Sans Devanagari', serif" font-weight="900" font-size="10.5" fill="#FFE599" text-anchor="middle" letter-spacing="1">
      प्रतिपच्चंद्र-
    </text>
    <text x="120" y="109" font-family="'Noto Sans Devanagari', serif" font-weight="900" font-size="10.5" fill="#FFE599" text-anchor="middle" letter-spacing="1">
      लेखेव वर्धिष्णुः
    </text>
    <text x="120" y="122" font-family="'Noto Sans Devanagari', serif" font-weight="900" font-size="10" fill="#FFE599" text-anchor="middle" letter-spacing="0.8">
      शिवस्यैषा मुद्रा
    </text>
    <text x="120" y="135" font-family="'Noto Sans Devanagari', serif" font-weight="900" font-size="10" fill="#FFE599" text-anchor="middle" letter-spacing="0.8">
      भद्राय राजते
    </text>

    <!-- Golden Wheat/Jowar Sheaf Base representing Agriculture -->
    <path d="M96,154 Q120,146 144,154 Q120,162 96,154 Z" fill="#FFE599" />
  </g>

  <!-- Side Decorative Stars -->
  <polygon points="50,120 54,123 52,128 47,125 43,128 44,123 41,120 46,120 47,115 49,120" fill="#FFD700" />
  <polygon points="190,120 194,123 192,128 187,125 183,128 184,123 181,120 186,120 187,115 189,120" fill="#FFD700" />
</svg>
