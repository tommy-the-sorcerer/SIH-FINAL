version: '3.8'

services:
  falcon-ai:
    build: .
    container_name: falcon-ai-sih26131
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - DEFAULT_LANGUAGE=mr
    volumes:
      - ./static/uploads:/app/static/uploads
      - ./falcon_ai.db:/app/falcon_ai.db
